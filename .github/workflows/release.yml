---
name: release
# Publish to Docker Hub on v* tags. Requires DOCKER_USERNAME and DOCKER_TOKEN.
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/android-sdk:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/android-sdk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
