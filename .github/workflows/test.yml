---
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable bin/android-sdk bin/wait-for-boot entrypoint.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: android-sdk:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: tools run
        # No SDK sync: this only checks the image's own tooling works as a
        # non-root uid with no passwd entry, which is how it is run.
        run: |
          docker run --rm -e ANDROID_SDK_SYNC=0 -e HOME=/tmp \
            --user 1234:1234 android-sdk:test \
            sdkmanager --sdk_root=/tmp/sdk --version
