---
name: boot
# Full end to end check: sync the SDK, create an AVD and boot it headless on
# the runner's KVM. Too slow and too large for every push, so weekly and on
# demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: anarkiwi/android-sdk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: sync sdk
        run: bin/android-sdk sdkmanager --version

      - name: create avd
        run: |
          bin/android-sdk avdmanager --silent create avd --force --name ci \
            --package 'system-images;android-34;google_apis_playstore;x86_64' \
            --device pixel_7

      - name: boot avd
        run: |
          bin/android-sdk emulator -avd ci -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -accel on &
          bin/wait-for-boot
          bin/android-sdk adb shell getprop ro.build.version.sdk
          bin/android-sdk adb emu kill
